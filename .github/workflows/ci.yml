name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
          - platform: windows-amd64
            runner: windows-2022
          - platform: macos-amd64
            runner: macos-15-intel
    env:
      CGO_CFLAGS: -O0 -g0 -Wno-deprecated-declarations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Select native packaging Python
        shell: bash
        run: |
          echo "PYTHON_NATIVE=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
          echo "UTILITY_BUILD_ROOT=$RUNNER_TEMP/kapila-utilities" >> "$GITHUB_ENV"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config build-essential \
            autoconf automake libtool patch flex bison perl curl xz-utils \
            libpng-dev zlib1g-dev libcdio-dev libiso9660-dev libpopt-dev \
            ffmpeg vcdimager dvdauthor genisoimage cdrdao xvfb xauth
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install gtk+3 adwaita-icon-theme hicolor-icon-theme gsettings-desktop-schemas pkg-config bash make autoconf automake libtool libpng zlib libcdio popt flex bison gpatch
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gcc
            make
            zip
            autoconf
            automake
            libtool
            patch
            flex
            bison
            perl
            python
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libcdio
            mingw-w64-x86_64-popt
      - name: Race tests, vet, and real VCD and DVD-Video authoring (no physical burn)
        if: runner.os == 'Linux'
        env:
          VCD_INTEGRATION: '1'
          DVD_VIDEO_INTEGRATION: '1'
        run: |
          make test
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s scripts/macruntime -p 'test_*.py'
      - name: GTK tests and headless language smoke checks (no physical burn)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a make test-gtk
          xvfb-run -a make smoke-gtk
      - name: Restore native utility downloads and verified payloads
        id: utilities
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/kapila-utilities/downloads
            ${{ runner.temp }}/kapila-utilities/recipe-*/payload
          key: utilities-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-utilities.sh', 'scripts/utility-sources.tsv', 'scripts/patches/**') }}
          restore-keys: |
            utilities-${{ runner.os }}-${{ runner.arch }}-
      - name: Package Linux and macOS executables
        if: runner.os != 'Windows'
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: make package
      - name: Package Windows executables and GTK runtime
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: make package
      - name: Save native utility downloads and verified payloads
        if: always() && steps.utilities.outputs.cache-primary-key != '' && steps.utilities.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/kapila-utilities/downloads
            ${{ runner.temp }}/kapila-utilities/recipe-*/payload
          key: ${{ steps.utilities.outputs.cache-primary-key }}
      - name: Smoke test the extracted Linux bundle (no physical burn)
        if: matrix.platform == 'linux-amd64'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          relocated=$(mktemp -d "$RUNNER_TEMP/kapila relocated.XXXXXX")
          trap 'rm -rf -- "$relocated"' EXIT
          tar -xzf "dist/kapila-maker-$PLATFORM.tar.gz" -C "$relocated"
          xvfb-run -a python3 scripts/smoke-bundle.py "$relocated/kapila-maker-$PLATFORM"
      - name: Smoke test ARM64 on the Raspberry Pi OS baselines
        if: matrix.platform == 'linux-arm64'
        run: |
          for suite in bookworm trixie; do
            docker run --rm --platform linux/arm64 -e DEBIAN_FRONTEND=noninteractive \
              -e "SUITE=$suite" -v "$PWD:/src:ro" "debian:$suite-slim" bash -euc '
                apt-get update
                if [[ $SUITE == bookworm ]]; then
                  packages=(libgtk-3-0 libcdio19 libiso9660-11 libpopt0)
                  smoke_args=()
                else
                  packages=(libgtk-3-0t64 vcdimager)
                  smoke_args=(--system-vcdimager)
                fi
                apt-get install -y --no-install-recommends python3 adwaita-icon-theme \
                  xvfb xauth "${packages[@]}"
                mkdir /tmp/relocated
                tar -xzf /src/dist/kapila-maker-linux-arm64.tar.gz -C /tmp/relocated
                xvfb-run -a python3 /src/scripts/smoke-bundle.py \
                  "${smoke_args[@]}" /tmp/relocated/kapila-maker-linux-arm64
              '
          done
      - name: Upload executable archive
        uses: actions/upload-artifact@v4
        with:
          name: kapila-maker-${{ matrix.platform }}
          path: |
            dist/kapila-maker-*.tar.gz
            dist/kapila-maker-*.zip
            dist/kapila-maker-*.exe
            dist/kapila-maker-*.dmg
          if-no-files-found: error
          retention-days: 14

  riscv64:
    name: Build linux-riscv64 (Debian system tools)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - name: Build and smoke-test RISC-V executables under QEMU
        run: |
          docker run --rm --platform linux/riscv64 \
            -e DEBIAN_FRONTEND=noninteractive -e GITHUB_SHA \
            -e EXPECTED_PLATFORM=linux-riscv64 -e GOMAXPROCS=4 -e GOFLAGS=-buildvcs=false \
            -v "$PWD:/src" -w /src \
            debian:trixie-slim@sha256:8262446fd210d732d072b0a09ba1dd015055971e642c82d145afe5ed88a059e7 \
            bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates pkg-config \
                build-essential golang-go libgtk-3-dev ffmpeg vcdimager dvdauthor \
                genisoimage python3 adwaita-icon-theme xvfb xauth
              make package
              mkdir /tmp/relocated
              tar -xzf dist/kapila-maker-linux-riscv64.tar.gz -C /tmp/relocated
              xvfb-run -a python3 scripts/smoke-bundle.py --system-tools /tmp/relocated/kapila-maker-linux-riscv64
            '
      - uses: actions/upload-artifact@v4
        with:
          name: kapila-maker-linux-riscv64
          path: dist/kapila-maker-linux-riscv64.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish executables
    needs: [build, riscv64]
    if: >-
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kapila-maker-*
          merge-multiple: true
          path: dist
      - name: Publish versioned or rolling release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/release.sh
